name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Quality job runs on Node 22 (the current engines.node floor); all dev
      # tooling (markdownlint-cli2, lint-staged) requires Node >= 22.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The single gate. `pre-push` runs this exact command, so local and CI
      # cannot drift: format check, markdownlint, prompt frontmatter, tests.
      - name: Run checks
        run: npm run check

      - name: Create summary
        if: success()
        run: |
          echo "## ✅ All Quality Checks Passed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Formatting (Prettier)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Markdown (markdownlint)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Prompt frontmatter" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Tests" >> $GITHUB_STEP_SUMMARY

  compat:
    name: Runtime (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      # `--omit=dev` deliberately: this job verifies the published surface
      # against the whole `engines.node` range. The CLI and tests use only
      # Node builtins.
      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Verify CLI syntax
        run: node --check bin/cli.js

      - name: Verify module syntax
        run: node --check src/index.js

      - name: Test CLI help
        run: node bin/cli.js --help

      - name: Test CLI list
        run: node bin/cli.js list

      - name: Run tests
        # validate-prompts.test.js requires js-yaml (devDep) — run only the dep-free CLI tests.
        run: node --test src/cli.test.js
