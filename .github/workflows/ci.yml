name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Quality job runs on Node 22 (the current engines.node floor); all dev
      # tooling (markdownlint-cli2, lint-staged) requires Node >= 22.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The single gate. `pre-push` runs this exact command, so local and CI
      # cannot drift: format check, markdownlint, prompt frontmatter, tests.
      - name: Run checks
        run: npm run check

      - name: Create summary
        if: success()
        run: |
          echo "## ✅ All Quality Checks Passed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Formatting (Prettier)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Markdown (markdownlint)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Prompt frontmatter" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ TypeScript (tsc --noEmit)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Build (unbuild → dist/)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Lint (eslint)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Tests" >> $GITHUB_STEP_SUMMARY

  compat:
    name: Runtime (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      # devDeps are needed for `npm run build`; pruned before CLI tests run to
      # verify the published surface has no devDep runtime leakage.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prune dev dependencies
        run: npm prune --omit=dev

      - name: Verify CLI syntax
        run: node --check dist/cli.mjs

      - name: Verify module syntax
        run: node --check dist/index.mjs

      - name: Test CLI help
        run: node dist/cli.mjs --help

      - name: Test CLI list
        run: node dist/cli.mjs list

      - name: Run tests
        # validate-prompts.test.js requires js-yaml (devDep) — run only the dep-free CLI tests.
        run: node --test src/cli.test.js
