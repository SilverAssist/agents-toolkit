name: Publish Package to npm

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the runner mint the OIDC token npm exchanges for publish rights.
      # Without it `npm publish` falls back to token auth and fails.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 24 ships npm 11.x, which supports trusted publishing natively.
          # Node 22 ships npm 10.x and needed a global `npm install -g npm@latest`
          # step, which is one more thing that can silently not take effect.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # npm's trusted-publishing guide: never cache in release builds.
          package-manager-cache: false

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Verify CLI syntax
        run: node --check dist/cli.mjs

      - name: Verify module syntax
        run: node --check dist/index.mjs

      - name: Test CLI
        run: node dist/cli.mjs list

      - name: Run tests
        run: npm test

      # Recorded so a publish failure can be diagnosed without a re-run:
      # trusted publishing needs npm >= 11.5.1.
      - name: Report npm version
        run: npm --version

      # No NODE_AUTH_TOKEN: auth comes from the OIDC token above, exchanged
      # against the trusted publisher configured for this package on npmjs.com
      # (org SilverAssist, repo agents-toolkit, workflow publish.yml).
      # Public repo + public package means provenance is attested automatically.
      - run: npm publish

      - name: Create summary
        if: success()
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "## 📦 Package Published Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`$PACKAGE_VERSION\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Links" >> $GITHUB_STEP_SUMMARY
          echo "- [View on npm](https://www.npmjs.com/package/@silverassist/agents-toolkit/v/$PACKAGE_VERSION)" >> $GITHUB_STEP_SUMMARY
          echo "- [npm package page](https://www.npmjs.com/package/@silverassist/agents-toolkit)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Install" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "npx @silverassist/agents-toolkit install" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
